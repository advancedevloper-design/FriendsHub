    <script src="/finconnect-sync.js"></script>
    <script>
      function launchPortalAsRole(role) {
        localStorage.setItem('finconnect_role', role);
        try {
          window.parent && window.parent.postMessage({ type: 'LAUNCH_PORTAL', role: role }, '*');
        } catch(e) {}
        window.location.href = '/portal.html';
      }

      // Intercept and sync dynamic forms on Home page
      document.addEventListener('submit', function(e) {
        const form = e.target;
        
        // 1. Check if it's the DSA registration form
        const nameInput = form.querySelector('input[placeholder*="Rajesh Kumar Sharma"]');
        const mobileInput = form.querySelector('input[placeholder*="10 digit mobile"]');
        const emailInput = form.querySelector('input[type="email"]');
        const cityInput = form.querySelector('input[placeholder*="Mumbai, Delhi"]');
        
        if (nameInput && mobileInput && emailInput) {
          const dsaData = {
            fullName: nameInput.value.trim(),
            mobile: mobileInput.value.trim(),
            email: emailInput.value.trim(),
            city: cityInput ? cityInput.value.trim() : 'Mumbai',
            currentProfession: form.querySelector('select')?.value || 'Loan Agent / DSA',
            expectedMonthlyVolume: form.querySelectorAll('select')[1]?.value || '₹50 Lakhs - ₹1 Crore'
          };
          if (window.FinConnectBridge) {
            window.FinConnectBridge.recordDsaRegistration(dsaData);
          }
          return;
        }

        // 2. Check if it's the Apply Loan modal form
        const loanAmountInput = form.querySelector('input[type="range"]') || form.querySelector('input[value*="0000"]');
        const custNameInput = form.querySelector('input[placeholder*="Full Name"], input[placeholder*="name"]');
        const custMobileInput = form.querySelector('input[placeholder*="mobile"], input[placeholder*="phone"]');
        if (custNameInput && custMobileInput) {
          const loanData = {
            customerName: custNameInput.value.trim(),
            customerMobile: custMobileInput.value.trim(),
            customerEmail: form.querySelector('input[type="email"]')?.value?.trim() || 'customer@friendskredit.com',
            customerPan: form.querySelector('input[placeholder*="PAN"]')?.value?.trim() || 'PENDING-KYC',
            loanAmount: loanAmountInput ? loanAmountInput.value : 500000,
            city: form.querySelector('input[placeholder*="city"], input[placeholder*="City"]')?.value?.trim() || 'Mumbai',
            preferredBank: form.querySelector('select')?.value || 'State Bank of India',
            employmentType: 'Salaried',
            monthlyIncome: 65000
          };
          if (window.FinConnectBridge) {
            window.FinConnectBridge.recordLoanApplication(loanData);
          }
        }
      }, true);
    </script>
